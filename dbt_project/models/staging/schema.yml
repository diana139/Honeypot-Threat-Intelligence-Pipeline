version: 2

models:
  - name: stg_cowrie_events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: session_id
        data_tests: [not_null]
      - name: event_ts
        data_tests: [not_null]
      - name: event_date
        data_tests: [not_null]
      - name: src_ip
        data_tests: [not_null]
      - name: sensor_name
        data_tests: [not_null]

      - name: protocol
        data_tests:
          - accepted_values:
              arguments:
                values: ['ssh', 'telnet']

      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - cowrie.session.connect
                  - cowrie.session.closed
                  - cowrie.session.params
                  - cowrie.session.file_download
                  - cowrie.session.file_download.failed
                  - cowrie.session.file_upload
                  - cowrie.client.version
                  - cowrie.client.kex
                  - cowrie.client.size
                  - cowrie.client.fingerprint
                  - cowrie.client.var
                  - cowrie.client.malformed_packet
                  - cowrie.login.success
                  - cowrie.login.failed
                  - cowrie.command.input
                  - cowrie.command.failed
                  - cowrie.command.success
                  - cowrie.command.chpasswd
                  - cowrie.log.closed
                  - cowrie.direct-tcpip.request
                  - cowrie.direct-tcpip.data
                  - cowrie.direct-tcpip.ja4
                  - cowrie.direct-tcpip.ja4h
              config:
                severity: warn

      # columns required only on some event types
      - name: username
        data_tests:
          - not_null:
              config:
                where: "event_type like 'cowrie.login.%'"
      - name: command_input
        data_tests:
          - not_null:
              config:
                where: "event_type = 'cowrie.command.input'"
      - name: file_sha256
        data_tests:
          - not_null:
              config:
                where: "event_type = 'cowrie.session.file_download'"
